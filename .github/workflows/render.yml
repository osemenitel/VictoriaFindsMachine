name: Victoria Video Maker

on:
  repository_dispatch:
    types: [build_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Забираем файлы со склада
        uses: actions/checkout@v3

      - name: Устанавливаем FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Монтаж и отправка в Телеграм
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          FILE_ID: ${{ github.event.client_payload.file_id }}
          EMOTION: ${{ github.event.client_payload.emotion }}
        run: |
          echo "1. Получаем путь к файлу..."
          FILE_PATH=$(curl -s "https://api.telegram.org/bot$BOT_TOKEN/getFile?file_id=$FILE_ID" | jq -r .result.file_path)
          
          echo "2. Скачиваем видео..."
          curl -s "https://api.telegram.org/file/bot$BOT_TOKEN/$FILE_PATH" -o input.mp4
          
          echo "3. Вычисляем длину для обрезки концовки..."
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input.mp4 || echo "0")
          
          # Бронебойная проверка длины
          if [ -z "$DURATION" ] || [ "$DURATION" == "0" ]; then
            echo "Не удалось узнать длину, монтируем без обрезки"
            TRIM_CMD=""
          else
            TRIM_TIME=$(awk -v d="$DURATION" 'BEGIN {if (d>3) print d-2.5; else print d}')
            TRIM_CMD="-t $TRIM_TIME"
          fi
          
          echo "4. Умный поиск нужной картинки..."
          # Убираем двойное emo_ если оно случайно появилось, чтобы всегда находить файл
          REAL_EMOTION=$(echo "$EMOTION" | sed 's/emo_//g')
          PIC="emo_$REAL_EMOTION"
          
          echo "5. Запускаем FFmpeg (Монтаж, уникализация, анимация)..."
          ffmpeg $TRIM_CMD -i input.mp4 -i "$PIC" -filter_complex "[0:v]scale=iw*1.02:ih*1.02,crop=iw/1.02:ih/1.02[bg];[1:v]scale=iw*0.35:-1[logo];[bg][logo]overlay=W-w:max(H-h\,H-t*2.5*h)" -c:a copy output.mp4
          
          echo "6. Отправляем в Телеграм..."
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendVideo" \
            -F chat_id=$CHAT_ID \
            -F video=@output.mp4 \
            -F caption="🔥 Видео уникализировано! Грузим в ВК?" \
            -F reply_markup='{"inline_keyboard": [[{"text": "🚀 Опубликовать в ВК", "callback_data": "post_vk"}]]}'
