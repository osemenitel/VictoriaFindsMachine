name: Victoria Video Maker

on:
  repository_dispatch:
    types: [build_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Забираем файлы
        uses: actions/checkout@v4

      - name: Устанавливаем FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq

      - name: Лечим русские буквы в названиях
        run: |
          # Автоматически переводим кириллические буквы-двойники в английские
          for f in *.png; do
            newname=$(echo "$f" | sed 'y/еоса/eoca/')
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
            fi
          done

      - name: Монтаж и отправка
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          FILE_ID: ${{ github.event.client_payload.file_id }}
          EMOTION: ${{ github.event.client_payload.emotion }}
        run: |
          say() {
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$CHAT_ID" --data-urlencode "text=$1" > /dev/null
          }

          if [ -z "$BOT_TOKEN" ]; then
            echo "Секрет пустой!"; exit 1
          fi

          GETFILE=$(curl -s "https://api.telegram.org/bot$BOT_TOKEN/getFile?file_id=$FILE_ID")
          FILE_PATH=$(echo "$GETFILE" | jq -r .result.file_path)
          if [ -z "$FILE_PATH" ] || [ "$FILE_PATH" == "null" ]; then
            say "❌ Телеграм не отдал файл: $(echo "$GETFILE" | head -c 300)"
            exit 1
          fi

          curl -s "https://api.telegram.org/file/bot$BOT_TOKEN/$FILE_PATH" -o input.mp4

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 input.mp4 || echo "0")
          if [ -z "$DURATION" ] || [ "$DURATION" == "0" ]; then
            TRIM_CMD=""
          else
            TRIM_TIME=$(awk -v d="$DURATION" 'BEGIN {if (d>3) print d-2.5; else print d}')
            TRIM_CMD="-t $TRIM_TIME"
          fi

          # Вытаскиваем главное слово (shock, laugh, think, facepalm, sign)
          CORE_WORD=$(echo "$EMOTION" | grep -oE '(shock|laugh|think|facepalm|sign)' | head -n 1)
          
          if [ -z "$CORE_WORD" ]; then
            say "❌ Ошибка: не понял эмоцию: $EMOTION"
            exit 1
          fi

          # Ищем любую PNG-картинку с этим словом
          PIC=$(ls *.png 2>/dev/null | grep -i "$CORE_WORD" | head -n 1)

          if [ -z "$PIC" ]; then
            FILES=$(ls *.png 2>/dev/null | tr '\n' ' ')
            say "❌ Не нашел картинку со словом '$CORE_WORD'. На складе лежат: $FILES"
            exit 1
          fi

          # Запуск монтажа
          if ! ffmpeg -y $TRIM_CMD -i input.mp4 -i "$PIC" -filter_complex "[0:v]scale=iw*1.02:ih*1.02,crop=iw/1.02:ih/1.02[bg];[bg]split[main][toblur];[toblur]crop=iw*0.4:ih*0.12:iw*0.6:ih*0.88,boxblur=20:20[blurred];[main][blurred]overlay=W-w:H-h[with_blur];[1:v]scale=500:-1[logo];[with_blur][logo]overlay=W-w:max(H-h\,H-t*2.5*h),scale=ceil(iw/2)*2:ceil(ih/2)*2,format=yuv420p[out_v]" -map "[out_v]" -map 0:a? -c:v libx264 -preset veryfast -crf 23 -c:a aac -movflags +faststart output.mp4 2> ffmpeg.log; then
            say "❌ FFmpeg упал: $(tail -c 700 ffmpeg.log)"
            exit 1
          fi

          RESP=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendVideo" \
            -F chat_id="$CHAT_ID" \
            -F video=@output.mp4 \
            -F caption="🔥 Готово!" \
            -F reply_markup='{"inline_keyboard": [[{"text": "🚀 Опубликовать в ВК", "callback_data": "post_vk"}]]}')
          
          if ! echo "$RESP" | jq -e .ok > /dev/null; then
            say "❌ Телеграм не принял готовое видео: $(echo "$RESP" | head -c 300)"
            exit 1
          fi
