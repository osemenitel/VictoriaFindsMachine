name: Victoria Factory Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Скачиваем код из репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем среду Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Устанавливаем библиотеки
      run: npm install node-telegram-bot-api axios

    - name: ЗАПУСК ПУЛЬТА УПРАВЛЕНИЯ
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        POLZA_API_KEY: ${{ secrets.POLZA_API_KEY }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: node index.js
